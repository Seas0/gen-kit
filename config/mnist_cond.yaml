seed_everything: 42
ckpt_path: null
data:
  class_path: diffusion.MNISTDataModule
  init_args:
    data_set: mnist
    data_dir: run/data
    mean: null
    std: null
    random_state: 42
    batch_size: 32
    num_workers: 0
model:
  class_path: diffusion.GenerativeModel
  init_args:
    in_channels: 1
    mid_channels:
    - 32
    - 64
    - 128
    kernel_size: 3
    padding: 1
    norm: batch
    activation: leaky_relu
    num_resblocks: 3
    upsample_mode: conv_transpose
    embed_dim: 128
    num_classes: 10
    num_steps: 1000
    schedule: cosine
    beta_range:
    - 1e-04
    - 0.02
    cosine_s: 0.008
    sigmoid_range:
    - -5.0
    - 5.0
    criterion: mse
    lr: 1e-03
    lr_schedule: constant
    lr_interval: epoch
    lr_warmup: 0
    backbone: unet
    model_type: diffusion
    trajectory: vp
    prediction_type: epsilon
    sampling_scheduler: ddpm
trainer:
  accelerator: auto
  max_epochs: 50
  log_every_n_steps: 100
  save_dir: run/
  name: mnist_cond
  version: null
  checkpoint_every_n_epochs: 1
