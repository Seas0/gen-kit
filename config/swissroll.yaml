seed_everything: 42
ckpt_path: null
data:
  class_path: diffusion.SwissRollDataModule
  init_args:
    num_train: 2400
    num_val: 600
    num_test: 0
    noise_level: 0.5
    scaling: 0.15
    random_state: 42
    batch_size: 32
    num_workers: 0
model:
  class_path: diffusion.GenerativeModel
  init_args:
    in_features: 2
    mid_features:
    - 128
    - 128
    - 128
    activation: leaky_relu
    embed_dim: 128
    num_steps: 500
    schedule: cosine
    beta_range:
    - 1e-04
    - 0.02
    cosine_s: 0.008
    sigmoid_range:
    - -5.0
    - 5.0
    criterion: mse
    lr: 1e-03
    lr_schedule: constant
    lr_interval: epoch
    lr_warmup: 0
    backbone: dense
    model_type: diffusion
    trajectory: vp
    prediction_type: epsilon
    sampling_scheduler: ddpm
trainer:
  accelerator: auto
  max_epochs: 1000
  log_every_n_steps: 5
  save_dir: run/
  name: swissroll
  version: null
  checkpoint_every_n_epochs: 10
