# Apply after a dataset config and set model.init_args.teacher_checkpoint.
model:
  class_path: diffusion.DistillationModel
  init_args:
    method: dmd2
    student_steps: 4
    teacher_steps: 32
    critic_updates: 5
    regression_weight: 0.0
    gan_weight: 0.003
    model_type: diffusion
    trajectory: vp
    prediction_type: v
    sampling_scheduler: distilled
    teacher_checkpoint: null
    norm: group
trainer:
  name: dmd2
  gradient_clip_val: 1.0
